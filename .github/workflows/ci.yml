name: ci

# NOTE: the cloud-itonami org may disable GitHub Actions org-wide; this
# workflow is kept correct and ready regardless — it runs verbatim once
# Actions are enabled. Until then the gates run locally / in the west
# superproject: `clojure -M:lint` and `clojure -M:dev:test`.
#
# The test job needs only langgraph + langchain (both PUBLIC) laid out at
# their monorepo-relative paths. It deliberately does NOT check out
# org-ethereum-jsonrpc: that dependency lives in the `:rpc` alias only and
# nothing under test/ requires `explorer.rpc`, so the whole suite is
# offline and needs no network and no third checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-6311-chainexplorer }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: test (governor contract · chain semantics · catalog honesty)
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6311-chainexplorer
        run: clojure -M:dev:test
      - name: offline demo reaches every disposition
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6311-chainexplorer
        run: clojure -M:dev:run

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-6311-chainexplorer }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/html, path: orgs/kotoba-lang/html }
      - uses: actions/checkout@v4
        with: { repository: kotoba-lang/css, path: orgs/kotoba-lang/css }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/jp-go-digital-design-system
          path: orgs/kotoba-lang/jp-go-digital-design-system
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g nbb
      # the published page is a build artifact: regenerate it and fail if
      # the committed copy is stale, so docs/index.html can never drift
      # from web/ or from src/explorer/chain.cljk.
      - name: regenerate + verify the public page
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6311-chainexplorer/web
        run: |
          nbb --classpath "../../../kotoba-lang/html/src:../../../kotoba-lang/css/src:../../../kotoba-lang/jp-go-digital-design-system/src" generate.cljs
          nbb verify_page.cljs
          cd .. && git diff --exit-code docs/
